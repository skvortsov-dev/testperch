name: Attach release ZIP
on:
  release:
    types: [published]
permissions:
  contents: write
jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run tests
        run: npm test
      - name: Build versioned ZIP and checksum
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: python3 scripts/package.py --tag "$RELEASE_TAG"
      - name: Attach files to the published release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: gh release upload "$RELEASE_TAG" dist/*.zip dist/*.sha256 --clobber
